<style>:root{--bg:#ece6d8;--sea:#c9d6dc;--land:#e9e3d3;--bd:#b9b19c;--pn:#fffcf4;--tx:#262219;--mu:#7b7466;--ac:#8f2b3a;--ln:#d5ccb7}
[data-theme=dark]{--bg:#12161c;--sea:#0e141b;--land:#1d2531;--bd:#37414f;--pn:#1b2029;--tx:#e8e2d2;--mu:#9a9482;--ac:#e8929f;--ln:#363d4a}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Georgia,"Times New Roman",serif}
#map{position:absolute;inset:0;background:var(--sea)}
button{font:inherit;color:inherit;background:var(--pn);border:1px solid var(--ln);border-radius:5px;padding:5px 11px;cursor:pointer}
button:hover:not(:disabled),button.on{border-color:var(--ac);color:var(--ac)}button:focus-visible,input:focus-visible{outline:2px solid var(--ac)}
#bar{position:absolute;top:8px;left:8px;right:8px;z-index:1100;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
#bar>div{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start}#bar>div>*{pointer-events:auto}
#bar h1{font-size:19px;margin:0 6px 0 0;background:var(--pn);padding:4px 11px;border:1px solid var(--ln);border-radius:5px;font-weight:600}
.grp{display:flex}.grp button{border-radius:0;margin-left:-1px}.grp button:first-child{border-radius:5px 0 0 5px;margin:0}.grp button:last-child{border-radius:0 5px 5px 0}
.ic{width:36px;height:34px;padding:0;display:grid;place-items:center;font-size:13px}.ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#lgm{position:absolute;top:44px;right:0;background:var(--pn);border:1px solid var(--ln);border-radius:5px;padding:6px 12px;display:none}
#lgw{position:relative;pointer-events:auto}
#box{position:absolute;z-index:1300;left:50px;bottom:8px;width:360px;max-height:52vh;overflow:auto;background:var(--pn);border:1px solid var(--ln);border-radius:7px;padding:12px 15px}
#box h2{margin:0 0 4px;font-size:22px;font-weight:600}#box p{margin:7px 0}.mu{color:var(--mu)}
.chip{margin:2px 3px 2px 0;padding:2px 9px;font-size:14px}.ghost{border-style:dashed;color:var(--mu);cursor:default}
.badge{font-size:12px;border:1px solid var(--ln);border-radius:9px;padding:0 7px;margin-right:4px;color:var(--mu)}
.src{font-size:13px;border-left:3px solid var(--ln);padding-left:9px;margin:8px 0}.src.pending{border-left-style:dotted;border-left-color:var(--ac)}
.src b{font-weight:600}sup button{padding:0 4px;font-size:13px;border:0;color:var(--ac);background:none}
.lbl{pointer-events:none;white-space:nowrap;text-align:center;font-weight:700;line-height:1;color:var(--tx);text-shadow:0 0 3px var(--bg),0 0 3px var(--bg),0 0 6px var(--bg);transform:translate(-50%,-50%);position:absolute}
#tree{position:absolute;z-index:1200;inset:52px 8px 8px 8px;background:var(--pn);border:1px solid var(--ln);border-radius:7px;display:none;flex-direction:column}
#tree.open{display:flex}#tree header{padding:9px;display:flex;gap:8px;border-bottom:1px solid var(--ln)}
#tq{flex:1;font:inherit;padding:5px 9px;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:5px}
#tw{overflow:auto;flex:1;cursor:grab;touch-action:pan-x pan-y}#tw.drag{cursor:grabbing}
#tc{position:relative}#tc svg{position:absolute;left:0;top:0;pointer-events:none}#tc path{fill:none;stroke:var(--mu);stroke-width:1.4}
#tc path.dot{stroke-dasharray:2 4;stroke:var(--ac)}#tc path.hi{stroke:var(--ac);stroke-width:2.4}
.tb{position:absolute;width:154px;height:38px;padding:1px 6px 0 8px;font-size:12.5px;line-height:1.25;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left-width:5px}
.tb.ghost{border-style:dashed;border-left-style:solid;opacity:.75;font-style:italic}.tb.ext{text-decoration:line-through;text-decoration-thickness:1px}
.tb.sel{outline:2px solid var(--ac)}.tb.dim{opacity:.18}.tb.hit{outline:2px solid #e0a800}
.leaflet-tooltip{background:var(--pn);color:var(--tx);border-color:var(--ln)}.leaflet-container{font-family:inherit}
@media(max-width:640px){#box{width:auto;right:8px;max-height:44vh}#about{right:52px}#bar h1{display:none}}
.tb small,#box .nat,.lbl small{color:var(--mu);font-weight:400;font-style:normal;display:block}.tb small{font-size:10.5px;overflow:hidden;text-overflow:ellipsis}
#box .nat{font-size:14px;margin:-2px 0 4px}.lbl small{font-size:.58em;margin-top:2px}
.inv .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.82) contrast(.95)}
#bar h1 small{font-size:12px;color:var(--mu);font-weight:400}
.infobtn{font:italic 700 17px/30px Georgia,serif!important;text-align:center}
#about{position:absolute;z-index:1350;right:52px;bottom:60px;width:min(440px,calc(100vw - 64px));background:var(--pn);border:1px solid var(--ln);border-radius:7px;padding:12px 38px 4px 15px;display:none}#about.open{display:block}
#about a{color:var(--ac)}#ax{position:absolute;right:6px;top:6px;border:0;background:none;font-size:20px;line-height:1;padding:2px 8px}
sup a{color:var(--ac);font-size:13px;text-decoration:none;padding:0 4px}.leaflet-bottom.leaflet-left{margin-bottom:6px}
.nw{white-space:nowrap}.leaflet-bottom.leaflet-right{margin-bottom:6px}
</style>
</head>
