*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Georgia,"Times New Roman",serif}
#map{position:absolute;inset:0;background:var(--sea)}
button{font:inherit;color:inherit;background:var(--pn);border:1px solid var(--ln);border-radius:5px;padding:5px 11px;cursor:pointer}
button:hover:not(:disabled),button.on{border-color:var(--ac);color:var(--ac)}button:focus-visible,input:focus-visible{outline:2px solid var(--ac)}

#bar h1{font-size:19px;margin:0 6px 0 0;background:var(--pn);padding:4px 11px;border:1px solid var(--ln);border-radius:5px;font-weight:600}
.grp{display:flex}.grp button{border-radius:0;margin-left:-1px}.grp button:first-child{border-radius:5px 0 0 5px;margin:0}.grp button:last-child{border-radius:0 5px 5px 0}

#lgm{position:absolute;top:44px;right:0;background:var(--pn);border:1px solid var(--ln);border-radius:5px;padding:6px 12px;display:none}
#lgw{position:relative;pointer-events:auto}

#box h2{margin:0 0 4px;font-size:22px;font-weight:600}#box p{margin:7px 0}.mu{color:var(--mu)}
.chip{margin:2px 3px 2px 0;padding:2px 9px;font-size:14px}.ghost{border-style:dashed;color:var(--mu);cursor:default}
.badge{font-size:12px;border:1px solid var(--ln);border-radius:9px;padding:0 7px;margin-right:4px;color:var(--mu)}
.src{font-size:13px;border-left:3px solid var(--ln);padding-left:9px;margin:8px 0}.src.pending{border-left-style:dotted;border-left-color:var(--ac)}
.src b{font-weight:600}sup button{padding:0 4px;font-size:13px;border:0;color:var(--ac);background:none}
.lbl{pointer-events:none;white-space:nowrap;text-align:center;font-weight:700;line-height:1;color:var(--tx);text-shadow:0 0 3px var(--bg),0 0 3px var(--bg),0 0 6px var(--bg);transform:translate(-50%,-50%);position:absolute}
.pnl{position:absolute;z-index:1200;inset:52px 8px 8px 8px;background:var(--pn);border:1px solid var(--ln);border-radius:7px;display:none;flex-direction:column}
.pnl.open{display:flex}.pnl header{padding:9px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--ln)}.pnl header .mu{flex:1;font-size:13px}
#tq{flex:1;min-width:0;font:inherit;padding:5px 9px;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:5px}
#tw{overflow:auto;flex:1;cursor:grab;touch-action:pan-x pan-y}#tw.drag{cursor:grabbing}
#tc{position:relative}#tc svg{position:absolute;left:0;top:0;pointer-events:none}#tc path{fill:none;stroke:var(--mu);stroke-width:1.4}

.tb{position:absolute;width:154px;height:38px;padding:1px 6px 0 8px;font-size:12.5px;line-height:1.25;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left-width:5px}
.tb.ghost{border-style:dashed;border-left-style:solid;opacity:.75;font-style:italic}
.tb.sel{outline:2px solid var(--ac)}.tb.dim{opacity:.18}.tb.hit{outline:2px solid #e0a800}
.leaflet-tooltip{background:var(--pn);color:var(--tx);border-color:var(--ln)}.leaflet-container{font-family:inherit}
@media(max-width:640px){#box{width:auto;right:8px;max-height:44vh}#about{right:52px}#bar h1{display:none}}
.tb small,#box .nat,.lbl small{color:var(--mu);font-weight:400;font-style:normal;display:block}.tb small{font-size:10.5px;overflow:hidden;text-overflow:ellipsis}
#box .nat{font-size:14px;margin:-2px 0 4px}.lbl small{font-size:.58em;margin-top:2px}
.inv .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.82) contrast(.95)}
#bar h1 small{font-size:12px;color:var(--mu);font-weight:400}
.infobtn{font:italic 700 17px/30px Georgia,serif!important;text-align:center}
#about{position:absolute;z-index:1350;right:52px;bottom:60px;width:min(440px,calc(100vw - 64px));background:var(--pn);border:1px solid var(--ln);border-radius:7px;padding:12px 38px 4px 15px;display:none}#about.open{display:block}
#about a{color:var(--ac)}#ax{position:absolute;right:6px;top:6px;border:0;background:none;font-size:20px;line-height:1;padding:2px 8px}
sup a{color:var(--ac);font-size:13px;text-decoration:none;padding:0 4px}.leaflet-bottom.leaflet-left{margin-bottom:6px}
.nw{white-space:nowrap}.leaflet-bottom.leaflet-right{margin-bottom:6px}

/* links and close controls look like [a] [close] */
.lk,#bxc{border:0;background:none;color:var(--ac);padding:2px 4px}.lk:hover:not(:disabled),#bxc:hover{text-decoration:underline}
#bxc{position:absolute;right:8px;top:6px}#box{position:absolute}#box h2{padding-right:56px}
#box a,#box sup a{color:var(--ac);text-decoration:none;font-size:13px}#box a:hover{text-decoration:underline}
[hidden]{display:none!important}
/* tree: [+]/[-] toggles, […] boxes */
.tg2{position:absolute;width:30px;height:20px;padding:0;font-size:12px;line-height:18px;text-align:center;background:var(--pn);border:0;color:var(--mu)}.tg2:hover{color:var(--ac)}.tg2.hi{color:var(--ac)}
.tb small.r{display:flex;justify-content:space-between;gap:6px}.tb small.r i{font-style:normal;color:var(--tx);white-space:nowrap}
.wcol{display:flex;flex-direction:column;gap:6px;align-items:flex-start}.wcol .row{display:flex;gap:6px}
#clw{position:relative}#clm{position:absolute;top:100%;left:0;margin-top:4px;display:none;flex-direction:column;background:var(--pn);border:1px solid var(--ln);border-radius:5px;padding:4px;gap:4px;white-space:nowrap}#clm.open{display:flex}

#wb{display:flex;flex:1;min-height:0}#wleft{width:190px;border-right:1px solid var(--ln);display:flex;flex-direction:column;min-height:0}#wq{margin:8px;padding:6px 9px;font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:5px;min-width:0}#wsec{flex:1;overflow-y:auto;padding:0 8px 8px;display:flex;flex-direction:column;gap:6px}

 bisc1236:{links:[{url:WP+"Biscayan_dialect"},{tip:"Because of its special features, Basque could well be split into two groups of dialects: Biscayan and all the rest. Georges Lacombe argued that the lines separating Biscayan from its neighbours (such as Gipuzkoan) run so close together that they form one clear border: its sounds, grammar and vocabulary all change in the same place. (As reported on Wikipedia.)"},{tip:"Biscayan is not one uniform dialect: it has two subdialects and eight main variations. Western subdialect: Uribe-Kosta, Mungialdea, Txorierri, Nerbion Valley, Zeberio, Arratia, Orozko. Eastern subdialect: Lea-Artibai, Durangaldea, Aramaio, Debagoiena, Debabarrena, Ermua, Eibar, Soraluze. Two transitional zones: Busturialdea, Otxandio and Villarreal (between the Western and Eastern subdialects), and Elgoibar, Deba, Mendaro and Mutriku (between Biscayan and Gipuzkoan). The Biscayan used by Sabino Arana and his followers added many new and purist word forms and used spellings such as ĺ and ŕ, but only some of these innovations were taken up by modern Biscayan and Standard Basque."}]},

  {url:RW+"B%C4%83ie%C8%99i",tip:"In Hungary two main groups of dialects are distinguished, those in the south-west of the country, called árgyelán “Transylvanian” and muncsán “Muntenian”. Besides the Transylvanian and the Muntenian type, there is one more type of dialects, that of the Tisza people, called ticsán by Hungarian researchers. The Transylvanian dialects are close to the Crișana subdialect of the Romanian language, while the Muntenian ones are close to the Muntenian subdialect of Romanian. In both, the influence of the Banat subdialect can be felt, more strongly in the Transylvanian Boyash dialects. The Tisza dialect is closer to the Crișana subdialect in Romania than the Transylvanian Boyash dialects are. (Translated from the Romanian.)"},

// ---- cluster: distance between languages from the words they share ----
const ALLW=SECS.flatMap(s=>s.words),WK=ALLW.map(w=>{const m=new Map();w.entries.forEach(e=>{if(!N[e[0]])return;if(!m.has(e[0]))m.set(e[0],new Set());m.get(e[0]).add(e[2])});return m}).filter(m=>m.size);
const LNG=[...new Set(WK.flatMap(m=>[...m.keys()]))].sort(byName);
const sim=(a,b)=>{let n=0,s=0;WK.forEach(m=>{if(m.has(a)&&m.has(b)){n++;if([...m.get(a)].some(k=>m.get(b).has(k)))s++}});return{n,s,v:n?s/n:null}};
const fmt=v=>String(Number(v.toFixed(3)));
let CM="i";
function renderC(){document.querySelectorAll("#cm button").forEach(b=>b.classList.toggle("on",b.dataset.m===CM));const c=$("#cbody");
 if(LNG.length<2){c.innerHTML='<p class="mu">There are not yet two languages with words, so there is nothing to compare.</p>';$("#chint").textContent="";return}
 if(CM==="i"){$("#chint").textContent="distance = shared roots / words both languages have";
  const cur=LNG.includes(S)?S:LNG.includes(c.dataset.id)?c.dataset.id:LNG[0];
  c.innerHTML=`<label>Language <select id="ci">${LNG.map(id=>`<option value="${id}" ${id===cur?"selected":""}>${esc(N[id].name)}</option>`).join("")}</select></label><div id="cr"></div>`;
  const run=()=>{const a=$("#ci").value;c.dataset.id=a;const g={},none=[];
   LNG.filter(b=>b!==a).forEach(b=>{const r=sim(a,b);if(r.v===null)none.push(N[b].name);else(g[fmt(r.v)]=g[fmt(r.v)]||[]).push(N[b].name)});
   $("#cr").innerHTML=Object.keys(g).sort((x,y)=>y-x).map(v=>`<p>${g[v].sort((x,y)=>x.localeCompare(y)).map(esc).join(", ")}: <b>${v}</b></p>`).join("")+(none.length?`<p class="mu">No shared words: ${none.sort((x,y)=>x.localeCompare(y)).map(esc).join(", ")}</p>`:"")};
  $("#ci").onchange=run;run()}
 else{$("#chint").textContent="languages joined by average distance (UPGMA); a language meets its closest relatives first";c.innerHTML=`<div id="cwheel">${wheel()}</div>`}}
function upgma(ids){const n=ids.length,d=[];for(let i=0;i<n;i++){d.push([]);for(let j=0;j<n;j++){const r=i===j?{v:1}:sim(ids[i],ids[j]);d[i][j]=r.v===null?1:1-r.v}}
 const T=ids.map((id,i)=>({id,sz:1,h:0,kids:[]}));let act=ids.map((_,i)=>i);
 while(act.length>1){let bi=0,bj=1,bd=Infinity;for(let x=0;x<act.length;x++)for(let y=x+1;y<act.length;y++){const v=d[act[x]][act[y]];if(v<bd){bd=v;bi=x;bj=y}}
  const i=act[bi],j=act[bj],k=T.length;T.push({sz:T[i].sz+T[j].sz,h:bd,kids:[T[i],T[j]]});d.forEach(r=>r[k]=0);d[k]=[];
  act.forEach(m=>{if(m!==i&&m!==j){const v=(T[i].sz*d[i][m]+T[j].sz*d[j][m])/(T[i].sz+T[j].sz);d[k][m]=v;d[m][k]=v}});d[k][k]=0;
  act=act.filter(m=>m!==i&&m!==j);act.push(k)}
 return T[act[0]]}
function wheel(){const root=upgma(LNG),leaves=[],walk=n=>n.kids.length?n.kids.forEach(walk):leaves.push(n);walk(root);
 const n=leaves.length,R=Math.max(180,n*15/6.2832),Z=R+150,Hm=root.h||1;let gi=0;
 leaves.forEach((l,i)=>l.a=i/n*2*Math.PI);
 const pt=(r,a)=>[Z+r*Math.sin(a),Z-r*Math.cos(a)],f=v=>v.toFixed(1);let out="";
 const lay=(nd,cut,gc)=>{if(!nd.kids.length){nd.r=R;nd.gc=gc;return}
  if(gc==null&&nd.h<=cut)gc=gi++;nd.r=R*(1-nd.h/Hm);nd.kids.forEach(k=>lay(k,cut,gc));nd.a=nd.kids.reduce((s,k)=>s+k.a,0)/nd.kids.length;nd.gc=gc};
 // a group = a subtree whose members share at least half their words' roots
 const lay2=nd=>{lay(nd,.5,null)};lay2(root);
 const draw1=nd=>{if(!nd.kids.length)return;const as=nd.kids.map(k=>k.a),a0=Math.min(...as),a1=Math.max(...as),c=nd.gc==null?"var(--mu)":PAL(nd.gc);
  const [x0,y0]=pt(nd.r,a0),[x1,y1]=pt(nd.r,a1);out+=`<path d="M${f(x0)} ${f(y0)}A${f(nd.r)} ${f(nd.r)} 0 ${a1-a0>Math.PI?1:0} 1 ${f(x1)} ${f(y1)}" fill="none" stroke="${c}" stroke-width="1.6"/>`;
  nd.kids.forEach(k=>{const [xa,ya]=pt(nd.r,k.a),[xb,yb]=pt(k.r,k.a);out+=`<path d="M${f(xa)} ${f(ya)}L${f(xb)} ${f(yb)}" stroke="${k.gc==null?"var(--mu)":PAL(k.gc)}" stroke-width="1.6"/>`;draw1(k)})};
 draw1(root);
 leaves.forEach(l=>{const [x,y]=pt(R+6,l.a),deg=l.a*180/Math.PI-90,fl=l.a>Math.PI;
  out+=`<text transform="translate(${f(x)} ${f(y)}) rotate(${f(fl?deg+180:deg)})" text-anchor="${fl?"end":"start"}" dominant-baseline="middle" ${l.gc==null?"":`style="fill:${PAL(l.gc)}"`}>${esc(N[l.id].name)}<title>${esc(N[l.id].name)}</title></text>`});
 return`<svg width="${2*Z}" height="${2*Z}" viewBox="0 0 ${2*Z} ${2*Z}" role="img" aria-label="Wheel of language distances">${out}</svg>`}
